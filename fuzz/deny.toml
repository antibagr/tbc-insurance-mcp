[bans]
multiple-versions = "deny"
wildcards = "deny"
skip = [
  { crate = "base64@0.22.1", reason = "hyper-util 0.1.20 retains base64 0.22 while the mutation adapter uses current base64 0.23 directly" },
  { crate = "getrandom@0.3.4", reason = "Rama 0.4.0 uses current ahash 0.8.12, whose runtime RNG requires the 0.3 API" },
  { crate = "itertools@0.13.0", reason = "Current bindgen requires the 0.13 API while Rama 0.4.0 uses 0.15" },
  { crate = "r-efi@5.3.0", reason = "The ahash transitive getrandom 0.3 UEFI backend requires r-efi 5; this target is not used on macOS" },
  { crate = "shlex@1.3.0", reason = "Rama's current bindgen 0.72.1 requires shlex 1 while cc requires shlex 2" },
  { crate = "syn@2.0.119", reason = "reqwest's platform and URL dependencies use syn 2 while rmcp 3.2.0 macros use syn 3" },
]

[sources]
unknown-git = "deny"
unknown-registry = "deny"

[licenses]
allow = [
  "Apache-2.0",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Zlib",
]
exceptions = [{ allow = ["NCSA"], crate = "libfuzzer-sys@0.4.13" }]
confidence-threshold = 0.93
unused-allowed-license = "deny"

[licenses.private]
ignore = true
