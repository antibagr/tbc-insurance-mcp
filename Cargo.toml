[package]
name = "tbc-insurance-mcp"
version = "0.5.0"
edition = "2024"
rust-version = "1.98"
description = "MCP server for reviewed TBC Insurance health-account workflows"
readme = "README.md"
repository = "https://github.com/antibagr/tbc-insurance-mcp"
license = "Apache-2.0"
publish = false

[lib]
name = "tbc_insurance_mcp"
path = "src/lib.rs"

[[bench]]
harness = false
name = "normalization"

[dependencies]
base64 = "=0.23.1"
futures = "=0.3.34"
getrandom = "=0.4.3"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls", "stream"] }
rmcp = { version = "=3.3.0", default-features = false, features = ["macros", "server"] }
schemars = "=1.2.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
tokio = { version = "=1.53.1", features = ["fs", "io-std", "io-util", "macros", "net", "rt", "sync", "time"] }
tokio-util = { version = "=0.7.19", features = ["codec"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "json"] }
zeroize = { version = "=1.9.0", features = ["serde"] }

[dev-dependencies]
criterion = "=0.8.2"
rmcp = { version = "=3.3.0", default-features = false, features = ["client", "elicitation", "transport-async-rw"] }
tokio = { version = "=1.53.1", features = ["io-util", "process", "rt-multi-thread", "test-util", "time"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "=3.7.0", default-features = false, features = ["OSX_10_14"] }
tbc-session-vault = { path = "crates/session-vault", version = "=0.1.0" }

[lints.clippy]
all = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"
