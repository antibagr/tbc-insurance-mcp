[package]
name = "tbc-session-vault"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Fixed-credential local vault for TBC Insurance sessions"
repository = "https://github.com/antibagr/tbc-insurance-mcp"
license = "Apache-2.0"
publish = false

[dependencies]
getrandom = "=0.4.3"
sha2 = "=0.11.0"
tokio = { version = "=1.53.1", features = ["macros", "rt", "sync", "time"] }
zeroize = "=1.9.0"

[target.'cfg(target_os = "macos")'.dependencies]
rama-net-apple-xpc = "=0.4.0"
security-framework = { version = "=3.7.0", default-features = false, features = ["OSX_10_14"] }

[lints.clippy]
all = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"
